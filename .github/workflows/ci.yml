name: Validate module
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate manifest and runtime files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('module.json','utf8'));
          if (m.id!=='telys-peak-cinema-cutscene-manager') throw new Error('Module ID mismatch');
          for (const p of [...m.esmodules,...m.styles]) if(!fs.existsSync(p)) throw new Error(`Missing ${p}`);
          JS
